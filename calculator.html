<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>

    <script src="calculator.js"></script>

    <style>
        body {
            background-color:linear-gradient(135deg,#0f172a,#1e293b,#0f172a);   /* peach / light yellow bg */
            height: 200vh;
            display:flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .calculator {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(59,130,246,.3),0 0 40px rgba(59,130,246,.15);
        }

        @media(max-width:600px){
            .calculator{
                width: 95%;
            }
            button{
                height: 60px;
                font: size 20px;;
            }
        }

        h1 {
            text-align: center;
            font-size: 20px;
            color: white;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #3b82f6;
        }

        input[type="text"] {
            width: 100%;
            height: 40px;
            background-color: #111827;
            border: none;
            font-size: 28px;
            text-align: right;
            padding-right: 15px;
            border-radius: 10px;
            color: white;
        }

        table {
            width: 100%;
            margin-top: 10px;
        }

        input[type="button"] {
            width: 100%;
            height: 36px;
            font-size: 16px;
            border: 1px solid #444;
            background-color: #fef9c3;   /* number buttons */
            cursor: pointer;
            border-radius: 8px;
            font-weight: bold;
        }
        input[type="button"]:hover{
            transform:scale(1.05);
        }

        .operator {
            background-color: #99f6e4;   /* teal */
        }

        .clear {
            background-color: #fdba74;   /* orange */
        }

        .equal {
            background-color: #86efac;   /* green */
            font-weight: bold;
        }

    </style>
</head>
<body>
<div class="calculator">
<h1>calculator</h1>
    <table>
        <tr>
            <td colspan="3">
                <input type="text" id="result">
            </td>
            <td>
                <input type="button" value="C" class="clear" onclick="clr()">
                <input type="button" value="⌫" onclick="backspace()">
             </td>
        </tr>

        <tr>
            <td><input type="button" value="7" onclick="dis('7')"></td>
            <td><input type="button" value="8" onclick="dis('8')"></td>
            <td><input type="button" value="9" onclick="dis('9')"></td>
            <td><input type="button" value="/" class="operator" onclick="dis('/')"></td>
        </tr>

        <tr>
            <td><input type="button" value="4" onclick="dis('4')"></td>
            <td><input type="button" value="5" onclick="dis('5')"></td>
            <td><input type="button" value="6" onclick="dis('6')"></td>
            <td><input type="button" value="-" class="operator" onclick="dis('-')"></td>
        </tr>

        <tr>
            <td><input type="button" value="1" onclick="dis('1')"></td>
            <td><input type="button" value="2" onclick="dis('2')"></td>
            <td><input type="button" value="3" onclick="dis('3')"></td>
            <td><input type="button" value="+" class="operator" onclick="dis('+')"></td>
        </tr>

        <tr>
            <td><input type="button" value="." onclick="dis('.')"></td>
            <td><input type="button" value="0" onclick="dis('0')"></td>
            <td><input type="button" value="=" class="equal" onclick="solve()"></td>
            <td><input type="button" value="*" class="operator" onclick="dis('*')"></td>
        </tr>
    </table>
</div>

</body>
</html>
